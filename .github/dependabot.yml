version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    target-branch: develop
    open-pull-requests-limit: 20
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    target-branch: develop
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
